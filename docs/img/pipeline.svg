<svg viewBox="0 0 1040 230" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="p_arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1038" height="228" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="42" font-size="21" font-weight="700" fill="#0f172a">Inside the pipeline</text>

  <!-- b1 ingest -->
  <rect x="20" y="86" width="184" height="112" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="112" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">1 &#183; Ingest</text>
  <text x="112" y="146" text-anchor="middle" font-size="12" fill="#1d4ed8">pcap &#183; live capture</text>
  <text x="112" y="166" text-anchor="middle" font-size="12" fill="#1d4ed8">NetFlow &#183; IPFIX &#183; sFlow</text>

  <!-- b2 flow meter -->
  <rect x="225" y="86" width="184" height="112" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="317" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#164e63">2 &#183; Flow meter</text>
  <text x="317" y="146" text-anchor="middle" font-size="12" fill="#0e7490">flows &#183; Community ID</text>
  <text x="317" y="166" text-anchor="middle" font-size="12" fill="#0e7490">JA3/JA4 &#183; SPLT &#183; DNS</text>

  <!-- b3 detect -->
  <rect x="430" y="86" width="184" height="112" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="522" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">3 &#183; Detect</text>
  <text x="522" y="146" text-anchor="middle" font-size="12" fill="#6d28d9">6 statistical detectors</text>
  <text x="522" y="166" text-anchor="middle" font-size="12" fill="#6d28d9">+ 2 ML (ml-flow, dga-ml)</text>

  <!-- b4 fuse -->
  <rect x="635" y="86" width="184" height="112" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="727" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">4 &#183; Fuse</text>
  <text x="727" y="146" text-anchor="middle" font-size="12" fill="#a16207">severity &#183; de-dup</text>
  <text x="727" y="166" text-anchor="middle" font-size="12" fill="#a16207">campaign correlation</text>

  <!-- b5 output -->
  <rect x="840" y="86" width="184" height="112" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="932" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">5 &#183; Output</text>
  <text x="932" y="146" text-anchor="middle" font-size="12" fill="#166534">alert (JSON Schema)</text>
  <text x="932" y="166" text-anchor="middle" font-size="12" fill="#166534">ledger &#183; dashboard</text>

  <!-- arrows -->
  <line x1="204" y1="142" x2="223" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#p_arw)"/>
  <line x1="409" y1="142" x2="428" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#p_arw)"/>
  <line x1="614" y1="142" x2="633" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#p_arw)"/>
  <line x1="819" y1="142" x2="838" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#p_arw)"/>
</svg>
