<svg viewBox="0 0 1040 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1038" height="298" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="44" font-size="21" font-weight="700" fill="#0f172a">How it works — one way in, nothing back</text>

  <!-- enclave container around ingest..alerts -->
  <rect x="430" y="86" width="586" height="168" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="448" y="110" font-size="13" font-weight="600" fill="#2563eb">Monitoring enclave &#183; no route back to production</text>

  <!-- boxes: y=150 h=84 w=160 -->
  <!-- b1 production -->
  <rect x="28" y="150" width="160" height="84" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="108" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Production</text>
  <text x="108" y="209" text-anchor="middle" font-size="12.5" fill="#4338ca">gateway traffic</text>

  <!-- b2 diode -->
  <rect x="232" y="150" width="160" height="84" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="312" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">TAP / Data diode</text>
  <text x="312" y="209" text-anchor="middle" font-size="12.5" fill="#92400e">one-way copy</text>

  <!-- b3 ingest -->
  <rect x="452" y="150" width="150" height="84" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="527" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Ingest</text>
  <text x="527" y="209" text-anchor="middle" font-size="12.5" fill="#334155">read-only</text>

  <!-- b4 detect -->
  <rect x="628" y="150" width="176" height="84" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="716" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Detect &amp; score</text>
  <text x="716" y="209" text-anchor="middle" font-size="12.5" fill="#6d28d9">6 statistical + 2 AI/ML</text>

  <!-- b5 alerts -->
  <rect x="830" y="150" width="170" height="84" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="915" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Alerts</text>
  <text x="915" y="209" text-anchor="middle" font-size="12.5" fill="#166534">dashboard + ledger</text>

  <!-- arrows -->
  <line x1="188" y1="192" x2="230" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="392" y1="192" x2="450" y2="192" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arwB)"/>
  <line x1="602" y1="192" x2="626" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="804" y1="192" x2="828" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>

  <text x="421" y="140" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2563eb">one direction only</text>
  <text x="312" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">&#10008; no path back</text>
</svg>
